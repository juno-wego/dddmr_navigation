bag_reader:
  ros__parameters:
    use_sim_time: true
    bag_file_dir: "/root/dddmr_bags/go2"
    point_cloud_topic: "/go2/lidar_points"
    odometry_topic: "/slamware_ros_sdk_server_node/odom"
    skip_frame: 2

lego_loam_ip:
  ros__parameters:
    use_sim_time: true
    laser:
      odom_type: "wheel_odometry"
      base_ground_frame: "base_footprint"
      num_vertical_scans: 16
      num_horizontal_scans: 440
      vertical_angle_bottom: -15.0
      vertical_angle_top: 15.0
      scan_period: 0.1

    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.5
      maximum_detection_range: 100.0
      distance_for_patch_between_rings: 1.0
      stitcher_num: 0
      trt_model_path: ""
      projected_image_stack_size: 1

      ground_fov_bottom: -0.2617994
      ground_fov_top: -0.087266
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926

lego_loam_fa:
  ros__parameters:
    use_sim_time: true
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 3.0

    mapping:
      to_map_optimization: true

lego_loam_mo:
  ros__parameters:
    use_sim_time: true
    mapping:
      distance_between_key_frame: 1.0
      angle_between_key_frame: 1.0

      enable_loop_closure: true

      surrounding_keyframe_search_num: 10
      history_keyframe_search_radius: 15.0
      history_keyframe_search_num: 5
      history_keyframe_fitness_score: 0.5

      ground_voxel_size: 0.4

lego_loam_map_visualization:
  ros__parameters:
    use_sim_time: true
    ground_voxel_size: 0.4
    ground_edge_threshold_num: 60
